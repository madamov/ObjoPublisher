name: Reusable Objo Linux Publish

on:
  workflow_call:
    inputs:
      solution-file:
        description: Path to the Objo solution file
        required: true
        type: string

      output-directory:
        description: Directory inside the current user's home directory
        required: false
        type: string
        default: Publish

      project-file:
        description: Path to project.json
        required: true
        type: string

      resource-files:
        description: Newline-separated file paths to copy into the project's Resources/Files directory
        required: false
        type: string
        default: ""

      application-name:
        description: Application name; leave empty to use the Name from project.json
        required: false
        type: string
        default: ""

      app-version:
        description: Semantic application version; invalid or empty values leave project.json unchanged
        required: false
        type: string
        default: ""

      sftp-url:
        description: Base SFTP URL for artifact upload
        required: false
        type: string
        default: ""

      fail-on-sftp-error:
        description: Exit with code 2 if SFTP upload fails
        required: false
        type: boolean
        default: false

      targets:
        description: Linux targets to publish, comma separated
        required: false
        type: string
        default: "linux-x64"

      artifact-name:
        description: Uploaded artifact name
        required: false
        type: string
        default: objo-linux-publish

      objo-version:
        description: Objo Studio version; leave empty to detect latest
        required: false
        type: string
        default: ""

    secrets:
      objo-license:
        required: true

      sftp-username:
        required: false

      sftp-password:
        required: false

      sftp-host-fingerprint:
        required: false
    
    outputs:
      sftp-upload:
        description: Result of SFTP upload
        value: ${{ jobs.publish-linux.outputs.sftp-upload }}

jobs:
  publish-linux:
    name: Publish Linux application
    runs-on: ubuntu-latest

    env:
      SOLUTION_FILE: ${{ inputs.solution-file }}
      PROJECT_FILE: ${{ inputs.project-file }}
      APPLICATION_NAME: ${{ inputs.application-name }}
      APP_VERSION: ${{ inputs.app-version }}
      OBJO_LICENSE_KEY: ${{ secrets.objo-license }}

    outputs:
      sftp-upload: ${{ steps.sftp-result.outputs.result }}

    steps:

      - name: Validate SFTP configuration
        id: sftp-config
        shell: bash
        env:
          SFTP_URL: ${{ inputs.sftp-url }}
          SFTP_USER: ${{ secrets.sftp-username }}
          SFTP_PASSWORD: ${{ secrets.sftp-password }}
          SFTP_HOST_FINGERPRINT: ${{ secrets.sftp-host-fingerprint }}
        run: |
          set -euo pipefail

          provided=()
          missing=()

          [[ -n "$SFTP_URL" ]] \
            && provided+=("sftp-url") \
            || missing+=("sftp-url")

          [[ -n "$SFTP_USER" ]] \
            && provided+=("sftp-username") \
            || missing+=("sftp-username")

          [[ -n "$SFTP_PASSWORD" ]] \
            && provided+=("sftp-password") \
            || missing+=("sftp-password")

          [[ -n "$SFTP_HOST_FINGERPRINT" ]] \
            && provided+=("sftp-host-fingerprint") \
            || missing+=("sftp-host-fingerprint")

          if (( ${#provided[@]} == 0 )); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SFTP upload is disabled."
            echo "No SFTP configuration values were supplied."
            exit 0
          fi

          if (( ${#missing[@]} == 0 )); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SFTP upload is enabled."
            echo "All required SFTP configuration values are present."
            exit 0
          fi

          echo "::error::Incomplete SFTP configuration."

          echo "Provided:"
          for item in "${provided[@]}"; do
            echo "  - $item"
          done

          echo "Missing:"
          for item in "${missing[@]}"; do
            echo "  - $item"
          done

          echo
          echo "Either provide all SFTP configuration values or none of them." >&2
          exit 1

      - name: Check out application repository
        uses: actions/checkout@v7

      - name: Set output directory
        shell: bash
        env:
          OUTPUT_FOLDER: ${{ inputs.output-directory }}
        run: |
          set -euo pipefail

          if [[ -z "$OUTPUT_FOLDER" ]]; then
            echo "Output directory input cannot be empty." >&2
            exit 1
          fi

          if [[ "$OUTPUT_FOLDER" = /* ]]; then
            OUTPUT_DIRECTORY="$OUTPUT_FOLDER"
          else
            OUTPUT_DIRECTORY="$HOME/$OUTPUT_FOLDER"
          fi

          echo "OUTPUT_DIRECTORY=$OUTPUT_DIRECTORY" >> "$GITHUB_ENV"
          echo "Output directory: $OUTPUT_DIRECTORY"

      - name: Validate workflow inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$SOLUTION_FILE" ]]; then
            echo "Objo solution file was not found: $SOLUTION_FILE" >&2
            exit 1
          fi

          if [[ ! -f "$PROJECT_FILE" ]]; then
            echo "Objo project file was not found: $PROJECT_FILE" >&2
            exit 1
          fi

          if ! jq empty "$PROJECT_FILE"; then
            echo "Project file is not valid JSON: $PROJECT_FILE" >&2
            exit 1
          fi

      - name: Copy resource files into the project
        shell: bash
        env:
          RESOURCE_FILES: ${{ inputs.resource-files }}
        run: |
          set -euo pipefail

          if [[ -z "$RESOURCE_FILES" ]]; then
            echo "No additional resource files were provided."
            exit 0
          fi

          RESOURCE_DIRECTORY="$(dirname "$PROJECT_FILE")/Resources/Files"
          mkdir -p "$RESOURCE_DIRECTORY"

          while IFS= read -r source || [[ -n "$source" ]]; do
            source="${source%$'\r'}"
            [[ -z "$source" ]] && continue

            if [[ ! -f "$source" ]]; then
              echo "Resource file was not found: $source" >&2
              exit 1
            fi

            destination="$RESOURCE_DIRECTORY/$(basename "$source")"
            cp "$source" "$destination"
            echo "Copied resource file: $source -> $destination"
          done <<< "$RESOURCE_FILES"


      - name: Configure application name in project.json
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$APPLICATION_NAME" ]]; then
            TMP_FILE="$(mktemp)"
            jq --arg name "$APPLICATION_NAME" '.Name = $name' \
              "$PROJECT_FILE" > "$TMP_FILE"
            mv "$TMP_FILE" "$PROJECT_FILE"
            echo "Using application name from workflow input: $APPLICATION_NAME"
          else
            APPLICATION_NAME="$(jq -er '.Name | select(type == "string" and length > 0)' "$PROJECT_FILE")"
            echo "APPLICATION_NAME=$APPLICATION_NAME" >> "$GITHUB_ENV"
            echo "Using application name from project.json: $APPLICATION_NAME"
          fi

      - name: Configure application version in project.json
        shell: bash
        run: |
          set -euo pipefail

          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ "$APP_VERSION" =~ $SEMVER_REGEX ]]; then
            TMP_FILE="$(mktemp)"
            jq --argjson major "${BASH_REMATCH[1]}" \
              --argjson minor "${BASH_REMATCH[2]}" \
              --argjson patch "${BASH_REMATCH[3]}" \
              '.MajorVersion = $major | .MinorVersion = $minor | .PatchVersion = $patch' \
              "$PROJECT_FILE" > "$TMP_FILE"
            mv "$TMP_FILE" "$PROJECT_FILE"
            echo "Using application version from workflow input: $APP_VERSION"
          else
            echo "Application version is empty or invalid; leaving version keys in project.json unchanged."
          fi
          
      - name: Determine Objo Studio version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.objo-version }}
        run: |
          set -euo pipefail
      
          JSON_URL="https://objo.dev/releases/stable.json"
          RELEASE_JSON="$RUNNER_TEMP/objo-stable.json"
      
          curl -fsSL "$JSON_URL" -o "$RELEASE_JSON"
      
          STABLE_VERSION="$(jq -er '.version' "$RELEASE_JSON")"
          STABLE_BASE_URL="$(jq -er '.downloads_base_url' "$RELEASE_JSON")"
          STABLE_DOWNLOAD_URL="$(jq -er '.downloads.linux.url' "$RELEASE_JSON")"
      
          if [[ ! "$STABLE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable version in stable.json: $STABLE_VERSION" >&2
            exit 1
          fi
      
          if [[ -n "$REQUESTED_VERSION" ]]; then
            VERSION="$REQUESTED_VERSION"
      
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid requested Objo Studio version: $VERSION" >&2
              exit 1
            fi
      
            DOWNLOADS_BASE_URL="$(
              printf '%s' "$STABLE_BASE_URL" |
                sed "s#/${STABLE_VERSION}\$#/${VERSION}#"
            )"
      
            DOWNLOAD_URL="$(
              printf '%s' "$STABLE_DOWNLOAD_URL" |
                sed "s#${STABLE_VERSION}#${VERSION}#g"
            )"
      
            echo "Using requested Objo Studio version: $VERSION"
          else
            VERSION="$STABLE_VERSION"
            DOWNLOADS_BASE_URL="$STABLE_BASE_URL"
            DOWNLOAD_URL="$STABLE_DOWNLOAD_URL"
      
            echo "Using latest Objo Studio version: $VERSION"
          fi
      
          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "Could not determine the Linux download URL." >&2
            exit 1
          fi
      
          {
            echo "version=$VERSION"
            echo "downloads_base_url=$DOWNLOADS_BASE_URL"
            echo "download_url=$DOWNLOAD_URL"
            if awk -v version="$VERSION" 'BEGIN {
              split(version, v, ".")
              exit !((v[1] + 0) > 26 ||
                (v[1] + 0) == 26 && (v[2] + 0) > 8 ||
                (v[1] + 0) == 26 && (v[2] + 0) == 8 && (v[3] + 0) >= 4)
            }'; then
              echo "license_mode=temporary"
            else
              echo "license_mode=persistent"
            fi
          } >> "$GITHUB_OUTPUT"
      
          echo "Downloads base URL: $DOWNLOADS_BASE_URL"
          echo "Download URL: $DOWNLOAD_URL"
          
      - name: Restore Objo Studio cache
        id: cache-objo
        uses: actions/cache@v5
        with:
          path: /opt/objo-studio
          key: objo-studio-linux-${{ steps.version.outputs.version }}

      - name: Download and extract Objo Studio
        if: steps.cache-objo.outputs.cache-hit != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          URL=${{ steps.version.outputs.download_url }}
          ARCHIVE="$RUNNER_TEMP/$(basename "$URL")"
          
          sudo rm -rf /opt/objo-studio
          sudo mkdir -p /opt/objo-studio
          sudo chown "$USER":"$(id -gn)" /opt/objo-studio

          curl -fL "$URL" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C /opt/objo-studio

      - name: Find Objo executable
        shell: bash
        run: |
          set -euo pipefail

          OBJO_BIN="$(
            find /opt/objo-studio \
              -type f \
              -name objo |
              head -n 1
          )"

          if [[ -z "$OBJO_BIN" ]]; then
            echo "Could not find the Objo executable." >&2
            exit 1
          fi

          chmod +x "$OBJO_BIN"
          echo "OBJO_BIN=$OBJO_BIN" >> "$GITHUB_ENV"

          echo "Objo executable: $OBJO_BIN"

      - name: Activate Objo license
        if: steps.version.outputs.license_mode == 'persistent'
        shell: bash
        run: |
          set -euo pipefail

          LICENSE_FILE="$RUNNER_TEMP/objo-license-key.txt"

          cleanup_license_file() {
            rm -f "$LICENSE_FILE"
          }

          trap cleanup_license_file EXIT

          printf '%s' "$OBJO_LICENSE_KEY" > "$LICENSE_FILE"

          "$OBJO_BIN" license activate \
            --key-file "$LICENSE_FILE"

      - name: Publish Linux application
        shell: bash
        env:
          PUBLISH_TARGETS: ${{ inputs.targets }}
          OBJO_LICENSE_MODE: ${{ steps.version.outputs.license_mode }}
        run: |
          set -euo pipefail

          mkdir -p "$OUTPUT_DIRECTORY"
          echo "Publishing to: $OUTPUT_DIRECTORY"

          cmd=(
            "$OBJO_BIN"
            publish
            "$SOLUTION_FILE"
          )

          IFS=',' read -ra TARGET_LIST <<< "$PUBLISH_TARGETS"

          target_count=0

          for target in "${TARGET_LIST[@]}"; do
            target="$(
              printf '%s' "$target" |
                sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//'
            )"

            [[ -z "$target" ]] && continue

            echo "Adding publish target: $target"
            cmd+=(--rid "$target")
            ((target_count += 1))
          done

          if (( target_count == 0 )); then
            echo "No valid Linux publish targets were provided." >&2
            exit 1
          fi

          cmd+=(--output "$OUTPUT_DIRECTORY")

          if [[ "$OBJO_LICENSE_MODE" == "temporary" ]]; then
            cmd+=(--license-key-env OBJO_LICENSE_KEY)
          fi

          echo "Running command:"
          printf ' %q' "${cmd[@]}"
          echo

          "${cmd[@]}"

      - name: Deactivate Objo license
        if: ${{ always() && steps.version.outputs.license_mode == 'persistent' }}
        shell: bash
        run: |
          set +e

          echo "Deactivating Objo license..."
          "$OBJO_BIN" license deactivate

          if [[ -d "$OUTPUT_DIRECTORY" ]]; then
            echo "Output directory contents:"
            find "$OUTPUT_DIRECTORY" \
              -maxdepth 4 \
              -type f \
              -print || true
          fi

      - name: Collect Linux archives
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_DIR="$OUTPUT_DIRECTORY/artifacts"
          mkdir -p "$ARTIFACT_DIR"

          archive_count=0

          while IFS= read -r -d '' archive; do
            archive_name="$(basename "$archive")"

            target_name="$(
              basename "$(dirname "$archive")"
            )"

            case "$archive_name" in
              *.tar.gz)
                extension="tar.gz"
                ;;

              *.tgz)
                extension="tgz"
                ;;

              *.zip)
                extension="zip"
                ;;

              *)
                echo "Unsupported archive type, skipping: $archive"
                continue
                ;;
            esac

            destination="$ARTIFACT_DIR/${APPLICATION_NAME}-${target_name}.${extension}"

            # Avoid overwriting if two archives resolve to the same name.
            if [[ -e "$destination" ]]; then
              destination="$ARTIFACT_DIR/${APPLICATION_NAME}-${archive_count}.${extension}"
            fi

            cp "$archive" "$destination"

            echo "Collected:"
            echo "  Source:      $archive"
            echo "  Destination: $destination"

            ((archive_count += 1))
          done < <(
            find "$OUTPUT_DIRECTORY" \
              -type f \
              \( \
                -name '*.tar.gz' \
                -o -name '*.tgz' \
                -o -name '*.zip' \
              \) \
              ! -path "$ARTIFACT_DIR/*" \
              -print0
          )

          if (( archive_count == 0 )); then
            echo "No Linux archives were found to upload." >&2
            exit 1
          fi

          echo "Prepared Linux artifacts:"
          ls -lh "$ARTIFACT_DIR"
          
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.OUTPUT_DIRECTORY }}/artifacts/*
          if-no-files-found: error

      - name: Verify and trust SFTP server SSH host key
        if: steps.sftp-config.outputs.enabled == 'true'
        shell: bash
        env:
          SFTP_BASE_URL: ${{ inputs.sftp-url }}
          EXPECTED_FINGERPRINT: ${{ secrets.sftp-host-fingerprint }}
        run: |
          set -euo pipefail
      
          if [[ "$SFTP_BASE_URL" != sftp://* ]]; then
            echo "sftp-url must start with sftp://." >&2
            exit 1
          fi
      
          #
          # Strip sftp:// and everything after host[:port].
          #
          AUTHORITY="${SFTP_BASE_URL#sftp://}"
          AUTHORITY="${AUTHORITY%%/*}"
      
          #
          # Remove optional user@.
          #
          HOST_PORT="${AUTHORITY##*@}"
      
          SFTP_HOST="$HOST_PORT"
          SFTP_PORT="22"
      
          #
          # Handle host:port.
          #
          if [[ "$HOST_PORT" == *:* ]]; then
            SFTP_HOST="${HOST_PORT%%:*}"
            SFTP_PORT="${HOST_PORT##*:}"
          fi
      
          if [[ -z "$SFTP_HOST" ]]; then
            echo "Could not extract SFTP hostname." >&2
            exit 1
          fi
      
          echo "SFTP host: $SFTP_HOST"
          echo "SFTP port: $SFTP_PORT"
      
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
      
          SCANNED_KEYS="$RUNNER_TEMP/sftp-host-keys"
          VERIFIED_KEYS="$RUNNER_TEMP/sftp-verified-host-keys"
      
          rm -f "$SCANNED_KEYS" "$VERIFIED_KEYS"
      
          echo "Retrieving SSH host keys..."
      
          ssh-keyscan \
            -p "$SFTP_PORT" \
            "$SFTP_HOST" \
            > "$SCANNED_KEYS"
      
          if [[ ! -s "$SCANNED_KEYS" ]]; then
            echo "ssh-keyscan returned no host keys." >&2
            exit 1
          fi
      
          echo "Verifying SSH host fingerprint..."
      
          match_found=false
      
          while IFS= read -r key_line; do
            [[ -n "$key_line" ]] || continue
            [[ "$key_line" == \#* ]] && continue
      
            ACTUAL_FINGERPRINT="$(
              printf '%s\n' "$key_line" |
                ssh-keygen -lf - -E sha256 |
                awk '{print $2}'
            )"
      
            echo "Found host key fingerprint: $ACTUAL_FINGERPRINT"
      
            if [[ "$ACTUAL_FINGERPRINT" == "$EXPECTED_FINGERPRINT" ]]; then
              printf '%s\n' "$key_line" >> "$VERIFIED_KEYS"
              match_found=true
            fi
          done < "$SCANNED_KEYS"
      
          if [[ "$match_found" != "true" ]]; then
            echo "SSH host key verification FAILED." >&2
            echo "None of the server keys matched the expected fingerprint." >&2
            exit 1
          fi
      
          echo "SSH host fingerprint verified successfully."
      
          #
          # Hash the verified known_hosts entries before storing them.
          #
          cp "$VERIFIED_KEYS" "$HOME/.ssh/known_hosts"
      
          ssh-keygen \
            -H \
            -f "$HOME/.ssh/known_hosts" \
            >/dev/null 2>&1
      
          rm -f "$HOME/.ssh/known_hosts.old"
      
          chmod 600 "$HOME/.ssh/known_hosts"
      
          echo "Verified host key installed in:"
          echo "  $HOME/.ssh/known_hosts"
          

      - name: Upload Linux artifacts to SFTP
        id: sftp
        if: steps.sftp-config.outputs.enabled == 'true'
        shell: bash
        env:
          SFTP_BASE_URL: ${{ inputs.sftp-url }}
          SFTP_USER: ${{ secrets.sftp-username }}
          SFTP_PASSWORD: ${{ secrets.sftp-password }}
          FAIL_ON_SFTP_ERROR: ${{ inputs.fail-on-sftp-error }}

        run: |
          set -uo pipefail

          ARTIFACT_DIR="$OUTPUT_DIRECTORY/artifacts"

          upload_to_sftp() (
            set -euo pipefail

            echo "Preparing SFTP upload..."

            if [[ "$SFTP_BASE_URL" != sftp://* ]]; then
              echo "SFTP URL must start with sftp://." >&2
              exit 1
            fi

            if [[ -z "$SFTP_USER" ]]; then
              echo "SFTP username cannot be empty." >&2
              exit 1
            fi

            if [[ -z "$SFTP_PASSWORD" ]]; then
              echo "SFTP password cannot be empty." >&2
              exit 1
            fi

            if [[ ! -d "$ARTIFACT_DIR" ]]; then
              echo "Artifact directory was not found:" >&2
              echo "  $ARTIFACT_DIR" >&2
              exit 1
            fi

            echo "Installed curl version:"
            curl --version

            protocols="$(
              curl --version |
                awk '
                  /^Protocols:/ {
                    for (i = 2; i <= NF; i++) {
                      print $i
                    }
                  }
                '
            )"

            if ! grep -qx "sftp" <<< "$protocols"; then
              echo "The installed curl does not support SFTP." >&2
              echo "Supported protocols:" >&2
              printf '  %s\n' $protocols >&2
              exit 1
            fi

            #
            # Extract hostname from the SFTP URL and add it
            # to known_hosts.
            #
            SFTP_HOST="$(
              printf '%s' "$SFTP_BASE_URL" |
                sed -E 's#^sftp://([^/@]+@)?([^/:]+)(:[0-9]+)?/?.*$#\2#'
            )"

            if [[ -z "$SFTP_HOST" ]]; then
              echo "Could not extract the host from SFTP URL." >&2
              exit 1
            fi

            echo "Adding SSH host key for $SFTP_HOST"

            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"

            ssh-keyscan -H "$SFTP_HOST" >> "$HOME/.ssh/known_hosts"

            chmod 600 "$HOME/.ssh/known_hosts"

            mapfile -d '' files < <(
              find "$ARTIFACT_DIR" \
                -maxdepth 1 \
                -type f \
                -print0
            )

            if (( ${#files[@]} == 0 )); then
              echo "No files were found to upload." >&2
              exit 1
            fi

            SFTP_DESTINATION="${SFTP_BASE_URL%/}/linux/"

            echo "Uploading ${#files[@]} file(s) to:"
            echo "  $SFTP_DESTINATION"

            for file in "${files[@]}"; do
              filename="$(basename "$file")"

              echo "Uploading: $filename"

              curl \
                --fail \
                --show-error \
                --silent \
                --ftp-create-dirs \
                --user "$SFTP_USER:$SFTP_PASSWORD" \
                --upload-file "$file" \
                "${SFTP_DESTINATION}${filename}"
            done

            echo "Linux artifacts uploaded successfully."
          )

          if upload_to_sftp; then
            echo "SFTP upload completed successfully."
            echo "result=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upload_exit_code=$?

          echo "::warning::Linux build succeeded, but SFTP upload failed."
          echo "SFTP upload command returned exit code $upload_exit_code."

          if [[ "$FAIL_ON_SFTP_ERROR" == "true" ]]; then
            echo "fail-on-sftp-error is TRUE."
            echo "Exiting workflow with code 2."
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 2
          fi

          echo "fail-on-sftp-error is FALSE."
          echo "Ignoring SFTP upload failure."
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Mark SFTP upload as skipped
        id: sftp-skipped
        if: steps.sftp-config.outputs.enabled != 'true'
        run: |
          echo "result=skipped" >> "$GITHUB_OUTPUT"

      - name: Finalize SFTP result
        id: sftp-result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.sftp-config.outputs.enabled }}" != "true" ]]; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ steps.sftp.outputs.result }}" ]]; then
            echo "result=${{ steps.sftp.outputs.result }}" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

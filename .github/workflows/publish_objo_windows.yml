name: Reusable Objo Windows Publish

on:
  workflow_call:
    inputs:
      solution-file:
        description: Path to the Objo solution file
        required: true
        type: string

      project-file:
        description: Path to project.json
        required: true
        type: string

      application-name:
        description: Application name
        required: true
        type: string

      output-directory:
        description: Directory inside the current user's home directory
        required: false
        type: string
        default: Publish

      targets:
        description: Windows targets to publish, comma separated
        required: false
        type: string
        default: "win-x64"

      artifact-name:
        description: Uploaded artifact name
        required: false
        type: string
        default: objo-windows-publish

      objo-version:
        description: Objo Studio version
        required: false
        type: string
        default: ""

      azure-correlation-id:
        description: Azure Trusted Signing correlation ID
        required: false
        type: string
        default: ""

      sftp-url:
        description: Base SFTP URL for artifact upload
        required: false
        type: string
        default: ""

      fail-on-sftp-error:
        description: Exit with code 2 if SFTP upload fails
        required: false
        type: boolean
        default: false

    outputs:
      sftp-upload:
        description: Result of SFTP upload
        value: ${{ jobs.publish-windows.outputs.sftp-upload }}

    secrets:
      objo-license:
        required: true

      azure-tenant-id:
        required: false

      azure-client-id:
        required: false

      azure-client-secret:
        required: false

      azure-endpoint:
        required: false

      azure-account-name:
        required: false

      azure-certificate-profile-name:
        required: false

      azure-package-publisher:
        required: false

      azure-timestamp-url:
        required: false

      sftp-username:
        required: false

      sftp-password:
        required: false

      sftp-host-fingerprint:
        required: false

jobs:
  publish-windows:
    name: Publish Windows application
    runs-on: windows-latest

    outputs:
      sftp-upload: ${{ steps.sftp-result.outputs.result }}

    env:
      SOLUTION_FILE: ${{ inputs.solution-file }}
      PROJECT_FILE: ${{ inputs.project-file }}
      APPLICATION_NAME: ${{ inputs.application-name }}

      AZURE_ENDPOINT: ${{ secrets.azure-endpoint }}
      AZURE_ACCOUNT_NAME: ${{ secrets.azure-account-name }}
      AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.azure-certificate-profile-name }}
      AZURE_PACKAGE_PUBLISHER: ${{ secrets.azure-package-publisher }}
      AZURE_TIMESTAMP_URL: ${{ secrets.azure-timestamp-url }}
      AZURE_CORRELATION_ID: ${{ inputs.azure-correlation-id }}
      AZURE_TENANT_ID: ${{ secrets.azure-tenant-id }}
      AZURE_CLIENT_ID: ${{ secrets.azure-client-id }}
      AZURE_CLIENT_SECRET: ${{ secrets.azure-client-secret }}

      OBJO_LICENSE: ${{ secrets.objo-license }}

    steps:

      - name: Check Azure signing configuration
        id: azure-signing
        shell: pwsh
        run: |
          $requiredValues = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_ENDPOINT,
            $env:AZURE_ACCOUNT_NAME,
            $env:AZURE_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_PACKAGE_PUBLISHER
          )

          $available = -not ($requiredValues | Where-Object {
            [string]::IsNullOrWhiteSpace($_)
          })

          "available=$($available.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ($available) {
            Write-Host "Azure Trusted Signing is enabled."
          }
          else {
            Write-Host "Azure Trusted Signing is disabled because one or more required secrets were not provided."
          }

      - name: Validate SFTP configuration
        id: sftp-config
        shell: pwsh
        env:
          SFTP_URL: ${{ inputs.sftp-url }}
          SFTP_USER: ${{ secrets.sftp-username }}
          SFTP_PASSWORD: ${{ secrets.sftp-password }}
          SFTP_HOST_FINGERPRINT: ${{ secrets.sftp-host-fingerprint }}
        run: |
          $ErrorActionPreference = "Stop"

          $values = [ordered]@{
            "sftp-url"              = $env:SFTP_URL
            "sftp-username"         = $env:SFTP_USER
            "sftp-password"         = $env:SFTP_PASSWORD
            "sftp-host-fingerprint" = $env:SFTP_HOST_FINGERPRINT
          }

          $provided = @()
          $missing = @()

          foreach ($entry in $values.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              $missing += $entry.Key
            }
            else {
              $provided += $entry.Key
            }
          }

          if ($provided.Count -eq 0) {
            "enabled=false" >> $env:GITHUB_OUTPUT

            Write-Host "SFTP upload is disabled."
            Write-Host "No SFTP configuration values were supplied."

            exit 0
          }

          if ($missing.Count -eq 0) {
            "enabled=true" >> $env:GITHUB_OUTPUT

            Write-Host "SFTP upload is enabled."
            Write-Host "All required SFTP configuration values are present."

            exit 0
          }

          Write-Host "::error::Incomplete SFTP configuration."

          Write-Host "Provided:"
          foreach ($item in $provided) {
            Write-Host "  - $item"
          }

          Write-Host "Missing:"
          foreach ($item in $missing) {
            Write-Host "  - $item"
          }

          Write-Host ""
          Write-Error "Either provide all SFTP configuration values or none of them."

          exit 1
          
      - name: Check out application repository
        uses: actions/checkout@v4

      - name: Set output directory
        shell: pwsh
        env:
          OUTPUT_FOLDER: ${{ inputs.output-directory }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:OUTPUT_FOLDER)) {
              throw "Output directory input cannot be empty."
          }

          if ([System.IO.Path]::IsPathRooted($env:OUTPUT_FOLDER)) {
              $outputDirectory = $env:OUTPUT_FOLDER
          }
          else {
              $outputDirectory = Join-Path $HOME $env:OUTPUT_FOLDER
          }

          "OUTPUT_DIRECTORY=$outputDirectory" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

          Write-Host "Output directory: $outputDirectory"

      - name: Validate workflow inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path $env:SOLUTION_FILE)) {
              throw "Objo solution file was not found: $env:SOLUTION_FILE"
          }

          if (!(Test-Path $env:PROJECT_FILE)) {
              throw "Objo project file was not found: $env:PROJECT_FILE"
          }

          Get-Content $env:PROJECT_FILE -Raw |
              ConvertFrom-Json |
              Out-Null

          if ([string]::IsNullOrWhiteSpace($env:APPLICATION_NAME)) {
              throw "Application name cannot be empty."
          }

      - name: Determine Objo Studio version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.objo-version }}
        run: |
          set -euo pipefail

          JSON_URL="https://objo.dev/releases/stable.json"
          RELEASE_JSON="$RUNNER_TEMP/objo-stable.json"

          curl -fsSL "$JSON_URL" -o "$RELEASE_JSON"

          STABLE_VERSION="$(jq -er '.version' "$RELEASE_JSON")"
          STABLE_BASE_URL="$(jq -er '.downloads_base_url' "$RELEASE_JSON")"
          STABLE_DOWNLOAD_URL="$(
            jq -er '
              .downloads.windows.variant_items[]
              | select(.platform=="win-x64-portable")
              | .url
            ' "$RELEASE_JSON"
          )"

          if [[ -n "$REQUESTED_VERSION" ]]; then
            VERSION="$REQUESTED_VERSION"

            DOWNLOADS_BASE_URL="$(
              printf '%s' "$STABLE_BASE_URL" |
                sed "s#/${STABLE_VERSION}\$#/${VERSION}#"
            )"

            DOWNLOAD_URL="$(
              printf '%s' "$STABLE_DOWNLOAD_URL" |
                sed "s#${STABLE_VERSION}#${VERSION}#g"
            )"

            echo "Using requested Objo Studio version: $VERSION"
          else
            VERSION="$STABLE_VERSION"
            DOWNLOADS_BASE_URL="$STABLE_BASE_URL"
            DOWNLOAD_URL="$STABLE_DOWNLOAD_URL"

            echo "Using latest Objo Studio version: $VERSION"
          fi

          {
            echo "version=$VERSION"
            echo "downloads_base_url=$DOWNLOADS_BASE_URL"
            echo "download_url=$DOWNLOAD_URL"
          } >> "$GITHUB_OUTPUT"

          echo "Downloads base URL: $DOWNLOADS_BASE_URL"
          echo "Download URL: $DOWNLOAD_URL"

      - name: Restore Objo Studio cache
        id: cache-objo
        uses: actions/cache@v4
        with:
          path: C:\Objo
          key: objo-studio-windows-${{ steps.version.outputs.version }}

      - name: Download Objo Studio
        if: steps.cache-objo.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          URL: ${{ steps.version.outputs.download_url }}
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Join-Path $env:RUNNER_TEMP (Split-Path $env:URL -Leaf)

          Write-Host "Downloading $env:URL"
          Write-Host "Archive: $zip"

          Invoke-WebRequest `
            -Uri $env:URL `
            -OutFile $zip

          Remove-Item `
            C:\Objo `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Expand-Archive `
            -Path $zip `
            -DestinationPath C:\Objo `
            -Force

      - name: Find Objo executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $objo = Get-ChildItem `
                    C:\Objo `
                    -Recurse `
                    -Filter objo.exe |
                  Select-Object -First 1

          if ($null -eq $objo) {
              throw "Could not locate objo.exe."
          }

          "OBJO_BIN=$($objo.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "Objo executable: $($objo.FullName)"

      - name: Configure project for external Windows signing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectPath = Resolve-Path $env:PROJECT_FILE
          $temporaryPath = Join-Path $env:RUNNER_TEMP "project.windows.json"

          $project = Get-Content $projectPath -Raw |
            ConvertFrom-Json

          if ($null -eq $project.Metadata) {
            $project |
              Add-Member `
                -MemberType NoteProperty `
                -Name Metadata `
                -Value ([pscustomobject]@{})
          }

          if ($null -eq $project.Metadata.Signing) {
            $project.Metadata |
              Add-Member `
                -MemberType NoteProperty `
                -Name Signing `
                -Value ([pscustomobject]@{})
          }

          if ($null -eq $project.Metadata.Signing.Windows) {
            $project.Metadata.Signing |
              Add-Member `
                -MemberType NoteProperty `
                -Name Windows `
                -Value ([pscustomobject]@{})
          }

          $windowsSigning = $project.Metadata.Signing.Windows

          $properties = @{
            AzureEndpoint               = ""
            AzureAccountName            = ""
            AzureCertificateProfileName = ""
            AzureCorrelationId          = ""
            TimestampUrl                = ""
            PackagePublisher            = $env:AZURE_PACKAGE_PUBLISHER
          }

          foreach ($property in $properties.GetEnumerator()) {
            if ($windowsSigning.PSObject.Properties.Name -contains $property.Key) {
              $windowsSigning.$($property.Key) = $property.Value
            }
            else {
              $windowsSigning |
                Add-Member `
                  -MemberType NoteProperty `
                  -Name $property.Key `
                  -Value $property.Value
            }
          }

          $project |
            ConvertTo-Json -Depth 100 |
            Set-Content `
              -Path $temporaryPath `
              -Encoding utf8

          Move-Item `
            -Path $temporaryPath `
            -Destination $projectPath `
            -Force

          Write-Host "Updated Windows signing configuration:"
          $project.Metadata.Signing.Windows |
            ConvertTo-Json -Depth 10 |
            Write-Host

      - name: Activate Objo license
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $licenseFile = Join-Path `
            $env:RUNNER_TEMP `
            "objo-license-key.txt"

          try {
            Set-Content `
              -Path $licenseFile `
              -Value $env:OBJO_LICENSE `
              -NoNewline `
              -Encoding utf8

            & $env:OBJO_BIN license activate `
              --key-file $licenseFile

            if ($LASTEXITCODE -ne 0) {
              throw "Objo license activation failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item `
              -Path $licenseFile `
              -Force `
              -ErrorAction SilentlyContinue
          }

      - name: Publish Windows application
        id: publish
        shell: pwsh
        env:
          PUBLISH_TARGETS: ${{ inputs.targets }}
        run: |
          $ErrorActionPreference = "Stop"
      
          New-Item `
            -ItemType Directory `
            -Path $env:OUTPUT_DIRECTORY `
            -Force |
            Out-Null
      
          Write-Host "Publishing to: $env:OUTPUT_DIRECTORY"
      
          $arguments = @(
            "publish"
            $env:SOLUTION_FILE
          )
      
          $correlationId = $env:AZURE_CORRELATION_ID
      
          if ([string]::IsNullOrWhiteSpace($correlationId)) {
            $correlationId = "$($env:APPLICATION_NAME)-$($env:GITHUB_RUN_ID)"
          }
      
          "AZURE_CORRELATION_ID=$correlationId" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8
      
          Write-Host "Azure correlation ID: $correlationId"
      
          $targetCount = 0
      
          foreach ($targetValue in $env:PUBLISH_TARGETS.Split(",")) {
            $target = $targetValue.Trim()
      
            if ([string]::IsNullOrWhiteSpace($target)) {
              continue
            }
      
            Write-Host "Adding publish target: $target"
      
            $arguments += "--rid"
            $arguments += $target
            $targetCount++
          }
      
          if ($targetCount -eq 0) {
            throw "No valid Windows publish targets were provided."
          }
      
          $arguments += "--output"
          $arguments += $env:OUTPUT_DIRECTORY
      
          Write-Host "Running:"
          Write-Host "`"$env:OBJO_BIN`" $($arguments -join ' ')"
      
          & $env:OBJO_BIN @arguments
      
          if ($LASTEXITCODE -ne 0) {
            throw "Objo publish failed with exit code $LASTEXITCODE."
          }

      - name: Deactivate Objo license
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
      
          Write-Host "Deactivating Objo license..."
      
          try {
            & $env:OBJO_BIN license deactivate
      
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Objo license deactivation returned exit code $LASTEXITCODE."
            }
          }
          catch {
            Write-Warning "Objo license deactivation failed: $($_.Exception.Message)"
          }
      
          if (Test-Path $env:OUTPUT_DIRECTORY) {
            Write-Host "Output directory contents:"
      
            Get-ChildItem `
              -Path $env:OUTPUT_DIRECTORY `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize
          }

      - name: Azure Trusted Signing (with timestamp)
        if: ${{ steps.azure-signing.outputs.available == 'true' && env.AZURE_TIMESTAMP_URL != '' }}
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.azure-tenant-id }}
          azure-client-id: ${{ secrets.azure-client-id }}
          azure-client-secret: ${{ secrets.azure-client-secret }}
          azure-correlation-id: ${{ env.AZURE_CORRELATION_ID }}

          endpoint: ${{ secrets.azure-endpoint }}
          trusted-signing-account-name: ${{ secrets.azure-account-name }}
          certificate-profile-name: ${{ secrets.azure-certificate-profile-name }}

          files-folder: ${{ env.OUTPUT_DIRECTORY }}
          files-folder-filter: msix
          files-folder-recurse: true

          file-digest: SHA256

          timestamp-rfc3161: ${{ secrets.azure-timestamp-url }}
          timestamp-digest: SHA256
          
      - name: Azure Trusted Signing
        if: ${{ steps.azure-signing.outputs.available == 'true' && env.AZURE_TIMESTAMP_URL == '' }}
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.azure-tenant-id }}
          azure-client-id: ${{ secrets.azure-client-id }}
          azure-client-secret: ${{ secrets.azure-client-secret }}
          azure-correlation-id: ${{ env.AZURE_CORRELATION_ID }}

          endpoint: ${{ secrets.azure-endpoint }}
          trusted-signing-account-name: ${{ secrets.azure-account-name }}
          certificate-profile-name: ${{ secrets.azure-certificate-profile-name }}

          files-folder: ${{ env.OUTPUT_DIRECTORY }}
          files-folder-filter: msix
          files-folder-recurse: true

          file-digest: SHA256


      - name: Collect Windows packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactDirectory = Join-Path `
            $env:OUTPUT_DIRECTORY `
            "artifacts"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifactDirectory |
            Out-Null

          $packageCount = 0

          Get-ChildItem `
            -Path $env:OUTPUT_DIRECTORY `
            -Recurse `
            -Filter *.msix |
          ForEach-Object {

            $destination = Join-Path `
              $artifactDirectory `
              $_.Name

            if (Test-Path $destination) {

              $parentFolder = Split-Path `
                $_.DirectoryName `
                -Leaf

              $destination = Join-Path `
                $artifactDirectory `
                "$($env:APPLICATION_NAME)-$parentFolder.msix"
            }

            Copy-Item `
              $_.FullName `
              $destination `
              -Force

            Write-Host "Collected:"
            Write-Host "  $($_.FullName)"

            $packageCount++
          }

          if ($packageCount -eq 0) {
            throw "No MSIX packages were found."
          }

          Write-Host ""
          Write-Host "Prepared artifacts:"
          Get-ChildItem `
            $artifactDirectory |
            Format-Table `
              Name,
              Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.OUTPUT_DIRECTORY }}\artifacts\*.msix
          if-no-files-found: error

      - name: Find SFTP-capable curl
        id: sftp-curl
        if: steps.sftp-config.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @(
            "C:\Program Files\Git\mingw64\bin\curl.exe",
            "C:\msys64\usr\bin\curl.exe",
            "C:\Windows\System32\curl.exe"
          )

          $selectedCurl = $null

          foreach ($candidate in $candidates) {

            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              Write-Host "Not found: $candidate"
              continue
            }

            Write-Host ""
            Write-Host "Checking: $candidate"

            $versionOutput = & $candidate --version
            $curlExitCode = $LASTEXITCODE

            if ($curlExitCode -ne 0) {
              Write-Warning "Could not run $candidate"
              continue
            }

            $versionOutput | ForEach-Object {
              Write-Host $_
            }

            $protocolLine = $versionOutput |
              Where-Object { $_ -match "^Protocols:" } |
              Select-Object -First 1

            if ($protocolLine -match "(^|\s)sftp(\s|$)") {
              $selectedCurl = $candidate
              break
            }

            Write-Host "This curl does not support SFTP."
          }

          if ($selectedCurl) {
            Write-Host ""
            Write-Host "Selected SFTP-capable curl:"
            Write-Host "  $selectedCurl"

            "found=true" >> $env:GITHUB_OUTPUT
            "path=$selectedCurl" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Warning "No installed curl executable supports SFTP."

            "found=false" >> $env:GITHUB_OUTPUT
            "path=" >> $env:GITHUB_OUTPUT
          }

      - name: Verify and trust SFTP server SSH host key
        if: steps.sftp-config.outputs.enabled == 'true'
        shell: pwsh
        env:
          SFTP_BASE_URL: ${{ inputs.sftp-url }}
          EXPECTED_FINGERPRINT: ${{ secrets.sftp-host-fingerprint }}
        run: |
          $ErrorActionPreference = "Stop"
      
          if (-not $env:SFTP_BASE_URL.StartsWith("sftp://")) {
            throw "sftp-url must start with sftp://."
          }
      
          $uri = [System.Uri]$env:SFTP_BASE_URL
      
          $sftpHost = $uri.Host
      
          if ([string]::IsNullOrWhiteSpace($sftpHost)) {
            throw "Could not extract SFTP hostname."
          }
      
          $sftpPort = $uri.Port
      
          if ($sftpPort -le 0) {
            $sftpPort = 22
          }
      
          Write-Host "SFTP host: $sftpHost"
          Write-Host "SFTP port: $sftpPort"
      
          #
          # Locate ssh-keyscan and ssh-keygen.
          #
          $gitSshDirectory = "C:\Program Files\Git\usr\bin"
      
          $sshKeyscanCandidates = @(
            (Join-Path $gitSshDirectory "ssh-keyscan.exe"),
            "C:\Windows\System32\OpenSSH\ssh-keyscan.exe"
          )
      
          $sshKeygenCandidates = @(
            (Join-Path $gitSshDirectory "ssh-keygen.exe"),
            "C:\Windows\System32\OpenSSH\ssh-keygen.exe"
          )
      
          $sshKeyscan = $sshKeyscanCandidates |
            Where-Object {
              Test-Path -LiteralPath $_ -PathType Leaf
            } |
            Select-Object -First 1
      
          $sshKeygen = $sshKeygenCandidates |
            Where-Object {
              Test-Path -LiteralPath $_ -PathType Leaf
            } |
            Select-Object -First 1
      
          if ([string]::IsNullOrWhiteSpace($sshKeyscan)) {
            throw "Could not locate ssh-keyscan.exe."
          }
      
          if ([string]::IsNullOrWhiteSpace($sshKeygen)) {
            throw "Could not locate ssh-keygen.exe."
          }
      
          Write-Host "Using ssh-keyscan:"
          Write-Host "  $sshKeyscan"
      
          Write-Host "Using ssh-keygen:"
          Write-Host "  $sshKeygen"
      
          #
          # Retrieve host keys.
          #
          $scannedKeysFile = Join-Path `
            $env:RUNNER_TEMP `
            "sftp-host-keys"
      
          $verifiedKeysFile = Join-Path `
            $env:RUNNER_TEMP `
            "sftp-verified-host-keys"
      
          Remove-Item `
            $scannedKeysFile, $verifiedKeysFile `
            -Force `
            -ErrorAction SilentlyContinue
      
          Write-Host "Retrieving SSH host keys..."
      
          & $sshKeyscan `
            -p $sftpPort `
            $sftpHost |
            Out-File `
              -FilePath $scannedKeysFile `
              -Encoding ascii
      
          if ($LASTEXITCODE -ne 0) {
            throw "ssh-keyscan failed with exit code $LASTEXITCODE."
          }
      
          if (-not (Test-Path $scannedKeysFile) -or
              (Get-Item $scannedKeysFile).Length -eq 0) {
            throw "ssh-keyscan returned no SSH host keys."
          }
      
          #
          # Verify each returned key.
          #
          $matchingKeys = @()
      
          foreach ($keyLine in Get-Content $scannedKeysFile) {
      
            if ([string]::IsNullOrWhiteSpace($keyLine)) {
              continue
            }
      
            if ($keyLine.StartsWith("#")) {
              continue
            }
      
            $temporaryKey = Join-Path `
              $env:RUNNER_TEMP `
              "sftp-single-host-key"
      
            Set-Content `
              -Path $temporaryKey `
              -Value $keyLine `
              -Encoding ascii
      
            $fingerprintOutput = & $sshKeygen `
              -lf $temporaryKey `
              -E sha256
      
            if ($LASTEXITCODE -ne 0) {
              continue
            }
      
            if ($fingerprintOutput -match "SHA256:[^\s]+") {
              $actualFingerprint = $Matches[0]
      
              Write-Host `
                "Found host key fingerprint: $actualFingerprint"
      
              if ($actualFingerprint -eq $env:EXPECTED_FINGERPRINT) {
                $matchingKeys += $keyLine
              }
            }
          }
      
          if ($matchingKeys.Count -eq 0) {
            throw @"
          SSH host key verification FAILED.
          None of the server keys matched the expected fingerprint.
          "@
          }
      
          Write-Host "SSH host fingerprint verified successfully."
      
          #
          # Install only verified key(s).
          #
          $sshDirectory = Join-Path $HOME ".ssh"
          $knownHosts = Join-Path $sshDirectory "known_hosts"
      
          New-Item `
            -ItemType Directory `
            -Path $sshDirectory `
            -Force |
            Out-Null
      
          $matchingKeys |
            Out-File `
              -FilePath $knownHosts `
              -Encoding ascii
      
          #
          # Hash hostnames in known_hosts.
          #
          & $sshKeygen `
            -H `
            -f $knownHosts |
            Out-Null
      
          $oldFile = "$knownHosts.old"
      
          Remove-Item `
            $oldFile `
            -Force `
            -ErrorAction SilentlyContinue
      
          Write-Host "Verified host key installed in:"
          Write-Host "  $knownHosts"

      - name: Upload Windows artifacts to SFTP
        id: sftp
        if: steps.sftp-config.outputs.enabled == 'true'
        shell: pwsh
        env:
          SFTP_BASE_URL: ${{ inputs.sftp-url }}
          SFTP_USER: ${{ secrets.sftp-username }}
          SFTP_PASSWORD: ${{ secrets.sftp-password }}
          SFTP_CURL: ${{ steps.sftp-curl.outputs.path }}
          SFTP_CURL_FOUND: ${{ steps.sftp-curl.outputs.found }}
          FAIL_ON_SFTP_ERROR: ${{ inputs.fail-on-sftp-error }}
        run: |
          $ErrorActionPreference = "Continue"

          $artifactDirectory = Join-Path `
            $env:OUTPUT_DIRECTORY `
            "artifacts"

          $uploadFailed = $false
          $uploadError = ""

          #
          # Validate curl.
          #

          if ($env:SFTP_CURL_FOUND -ne "true" -or
              [string]::IsNullOrWhiteSpace($env:SFTP_CURL)) {

            $uploadFailed = $true
            $uploadError = "No installed curl executable supports SFTP."
          }

          elseif (-not (
            Test-Path `
              -LiteralPath $env:SFTP_CURL `
              -PathType Leaf
          )) {
            $uploadFailed = $true
            $uploadError = "Selected curl was not found: $env:SFTP_CURL"
          }

          #
          # Validate SFTP URL.
          #

          elseif (-not $env:SFTP_BASE_URL.StartsWith("sftp://")) {
            $uploadFailed = $true
            $uploadError = "sftp-url must start with sftp://."
          }

          #
          # Validate artifact directory.
          #

          elseif (-not (
            Test-Path `
              -LiteralPath $artifactDirectory `
              -PathType Container
          )) {
            $uploadFailed = $true
            $uploadError = `
              "Artifact directory was not found: $artifactDirectory"
          }

          if (-not $uploadFailed) {

            Write-Host "Using curl:"
            Write-Host "  $env:SFTP_CURL"
            Write-Host ""

            & $env:SFTP_CURL --version

            if ($LASTEXITCODE -ne 0) {
              $uploadFailed = $true
              $uploadError = `
                "Failed to run selected curl executable."
            }
          }

          #
          # Find files.
          #

          if (-not $uploadFailed) {

            $files = @(
              Get-ChildItem `
                -LiteralPath $artifactDirectory `
                -File
            )

            if ($files.Count -eq 0) {
              $uploadFailed = $true
              $uploadError = `
                "No Windows artifact files were found to upload."
            }
          }

          #
          # Upload.
          #

          if (-not $uploadFailed) {

            $destination = `
              "$($env:SFTP_BASE_URL.TrimEnd('/'))/windows/"

            Write-Host ""
            Write-Host "Uploading $($files.Count) file(s) to:"
            Write-Host "  $destination"

            foreach ($file in $files) {

              $escapedFilename = `
                [System.Uri]::EscapeDataString($file.Name)

              $remoteUrl = "$destination$escapedFilename"

              Write-Host ""
              Write-Host "Uploading: $($file.Name)"

              & $env:SFTP_CURL `
                --fail `
                --show-error `
                --silent `
                --ftp-create-dirs `
                --user "${env:SFTP_USER}:${env:SFTP_PASSWORD}" `
                --upload-file $file.FullName `
                $remoteUrl

              $curlExitCode = $LASTEXITCODE

              if ($curlExitCode -ne 0) {
                $uploadFailed = $true
                $uploadError = `
                  "Upload failed for $($file.Name), curl exit code $curlExitCode."
                break
              }
            }
          }

          #
          # Set result and correct workflow exit code.
          #

          if (-not $uploadFailed) {

            "result=success" >> $env:GITHUB_OUTPUT

            Write-Host ""
            Write-Host "Windows artifacts uploaded successfully."

            exit 0
          }

          "result=failed" >> $env:GITHUB_OUTPUT

          Write-Warning `
            "Windows build succeeded, but SFTP upload failed."

          Write-Warning $uploadError

          if ($env:FAIL_ON_SFTP_ERROR -eq "true") {
            Write-Host ""
            Write-Host "fail-on-sftp-error is TRUE."
            Write-Host "Exiting with code 2."

            exit 2
          }

          Write-Host ""
          Write-Host "fail-on-sftp-error is FALSE."
          Write-Host "Ignoring SFTP upload failure."

          exit 0

      - name: Finalize SFTP result
        id: sftp-result
        if: always()
        shell: pwsh
        run: |
          $enabled = "${{ steps.sftp-config.outputs.enabled }}"
          $result = "${{ steps.sftp.outputs.result }}"

          if ($enabled -ne "true") {
            $result = "skipped"
          }
          elseif ([string]::IsNullOrWhiteSpace($result)) {
            $result = "failed"
          }

          "result=$result" >> $env:GITHUB_OUTPUT

          Write-Host "Final SFTP result: $result"

      - name: Workflow summary
        if: always()
        shell: pwsh
        run: |
          $buildResult = "${{ steps.publish.outcome }}"
          $sftpResult = "${{ steps.sftp-result.outputs.result }}"

          if ([string]::IsNullOrWhiteSpace($buildResult)) {
            $buildResult = "not-run"
          }

          if ([string]::IsNullOrWhiteSpace($sftpResult)) {
            $sftpResult = "skipped"
          }

          @"
          # Objo Windows Publish Summary

          | Item | Result |
          |---|---|
          | Application | ``${{ inputs.application-name }}`` |
          | Targets | ``${{ inputs.targets }}`` |
          | Artifact | ``${{ inputs.artifact-name }}`` |
          | Build | **$buildResult** |
          | SFTP upload | **$sftpResult** |

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

          if ($buildResult -eq "success") {
            "✅ Windows application published successfully." |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Encoding utf8 `
                -Append
          }
          elseif ($buildResult -eq "failure") {
            "❌ Windows application build failed." |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Encoding utf8 `
                -Append
          }

          "" |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append

          if ("${{ steps.azure-signing.outputs.available }}" -ne "true") {
            "⚠️ Azure signing was skipped." |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Encoding utf8 `
                -Append

            "" |
              Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Encoding utf8 `
                -Append
          }

          switch ($sftpResult) {

            "success" {
              "✅ Windows artifacts uploaded to the SFTP server." |
                Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY `
                  -Encoding utf8 `
                  -Append
            }

            "failed" {
              if ("${{ inputs.fail-on-sftp-error }}" -eq "true") {

                @"
          ❌ SFTP upload failed and ``fail-on-sftp-error`` is enabled.

          **Workflow exit code: 2**
          "@ |
                  Out-File `
                    -FilePath $env:GITHUB_STEP_SUMMARY `
                    -Encoding utf8 `
                    -Append
              }
              else {
                "⚠️ SFTP upload failed, but the failure was ignored." |
                  Out-File `
                    -FilePath $env:GITHUB_STEP_SUMMARY `
                    -Encoding utf8 `
                    -Append
              }
            }

            "skipped" {
              "➖ SFTP upload was not performed." |
                Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY `
                  -Encoding utf8 `
                  -Append
            }
          }
